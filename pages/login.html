<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | CampusMart</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="../css/animations.css">
</head>
<body style="background-color: var(--neutral-bg); min-height: 100vh; display: flex; flex-direction: column;">

    <!-- Navbar -->
    <header class="header">
        <div class="container navbar">
            <a href="../index.html" class="logo">
                CAMPUS<span>MART</span>
            </a>
            <a href="../index.html" class="btn btn-outline btn-sm">← Back to Home</a>
        </div>
    </header>

    <!-- Main Login Area -->
    <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 3rem 1rem;">
        <div class="card" style="width: 100%; max-width: 440px; padding: 2.5rem; border-top: 5px solid var(--secondary-blue);">
            <div style="text-align: center; margin-bottom: 2rem;">
                <h2 style="font-size: 1.8rem; margin-bottom: 0.5rem;">Welcome Back 👋</h2>
                <p style="font-size: 0.95rem; color: var(--neutral-text-muted);">Sign in to access your student marketplace dashboard</p>
            </div>

            <form id="login-form">
                <div class="form-group">
                    <label class="form-label" for="login-role">Select Role</label>
                    <select class="form-select" id="login-role">
                        <option value="buyer">Buyer (Browse, Wishlist, Order)</option>
                        <option value="seller">Seller (List products, Manage Bids/Offers)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label" for="login-email">Campus Email</label>
                    <input type="email" class="form-control" id="login-email" placeholder="student@college.edu" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="login-password">Password</label>
                    <input type="password" class="form-control" id="login-password" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 1rem;">
                    Sign In to Account
                </button>
            </form>

            <div style="margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid var(--neutral-border); text-align: center; font-size: 0.9rem; color: var(--neutral-text-muted);">
                Don't have a CampusMart account? <br>
                <a href="signup.html" style="font-weight: 700; color: var(--accent-orange); display: inline-block; margin-top: 0.5rem;">Create an Account Now →</a>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer" style="padding-top: 2rem; padding-bottom: 1.5rem;">
        <div class="container" style="text-align: center; font-size: 0.85rem; color: #94A3B8;">
            © 2026 CampusMart. Browser-Based Educational Demonstration Engine.
        </div>
    </footer>

    <script src="../js/data.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/app.js"></script>
</body>
</html>
