<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | CampusMart</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="../css/animations.css">
</head>
<body style="background-color: var(--neutral-bg); min-height: 100vh; display: flex; flex-direction: column;">

    <!-- Navbar -->
    <header class="header">
        <div class="container navbar">
            <a href="../index.html" class="logo">
                CAMPUS<span>MART</span>
            </a>
            <a href="../index.html" class="btn btn-outline btn-sm">← Back to Home</a>
        </div>
    </header>

    <!-- Main Registration Form -->
    <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 3rem 1rem;">
        <div class="card" style="width: 100%; max-width: 520px; padding: 2.5rem; border-top: 5px solid var(--accent-orange);">
            <div style="text-align: center; margin-bottom: 2rem;">
                <h2 style="font-size: 1.8rem; margin-bottom: 0.5rem;">Join CampusMart 🎓</h2>
                <p style="font-size: 0.95rem; color: var(--neutral-text-muted);">Create your student account to buy, sell, and offer campus services</p>
            </div>

            <form id="signup-form">
                <div class="form-group">
                    <label class="form-label" for="signup-role">Select Primary Role</label>
                    <select class="form-select" id="signup-role">
                        <option value="buyer">Buyer (Discover products & hire services)</option>
                        <option value="seller">Seller (List items, run auctions, offer services)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label" for="signup-fullname">Full Name</label>
                    <input type="text" class="form-control" id="signup-fullname" placeholder="e.g. Rahul Sharma" required>
                </div>

                <div class="grid grid-cols-2" style="gap: 1rem;">
                    <div class="form-group">
                        <label class="form-label" for="signup-email">College Email</label>
                        <input type="email" class="form-control" id="signup-email" placeholder="student@college.edu" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="signup-phone">WhatsApp Phone</label>
                        <input type="tel" class="form-control" id="signup-phone" placeholder="9876543210" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="signup-college">College / Department / Branch</label>
                    <input type="text" class="form-control" id="signup-college" placeholder="Campus Institute of Tech (BTech CSE 3rd Year)" required>
                </div>

                <div class="grid grid-cols-2" style="gap: 1rem;">
                    <div class="form-group">
                        <label class="form-label" for="signup-password">Password</label>
                        <input type="password" class="form-control" id="signup-password" placeholder="••••••••" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="signup-confirmpassword">Confirm Password</label>
                        <input type="password" class="form-control" id="signup-confirmpassword" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-accent btn-block btn-lg" style="margin-top: 1rem;">
                    Create Campus Account
                </button>
            </form>

            <div style="margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid var(--neutral-border); text-align: center; font-size: 0.9rem; color: var(--neutral-text-muted);">
                Already have an account? <br>
                <a href="login.html" style="font-weight: 700; color: var(--secondary-blue); display: inline-block; margin-top: 0.5rem;">Sign In Here →</a>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer" style="padding-top: 2rem; padding-bottom: 1.5rem;">
        <div class="container" style="text-align: center; font-size: 0.85rem; color: #94A3B8;">
            © 2026 CampusMart. Browser-Based Educational Demonstration Engine.
        </div>
    </footer>

    <script src="../js/data.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/app.js"></script>
</body>
</html>
